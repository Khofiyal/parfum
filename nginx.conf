# /etc/nginx/sites-available/parfum-store
# Konfigurasi Nginx untuk Parfum Store
# Aktifkan dengan: sudo ln -s /etc/nginx/sites-available/parfum-store /etc/nginx/sites-enabled/

# ─── Rate limiting zones ──────────────────────────────────────────────────────
# Definisikan di /etc/nginx/nginx.conf dalam blok http {}
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

# ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # ACME challenge untuk Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Main Server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;

    # ─── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # SSL Protocol & Ciphers (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self https://app.midtrans.com)" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://app.midtrans.com https://app.sandbox.midtrans.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https://*.r2.cloudflarestorage.com https://assets.yourdomain.com https://lh3.googleusercontent.com;
        connect-src 'self' https://app.midtrans.com https://app.sandbox.midtrans.com;
        frame-src https://app.midtrans.com https://app.sandbox.midtrans.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
    " always;

    # ─── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/parfum-store.access.log combined;
    error_log /var/log/nginx/parfum-store.error.log warn;

    # ─── Rate Limiting ────────────────────────────────────────────────────────
    # API routes — 10 req/s dengan burst 20
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Webhook — hanya izinkan IP Midtrans
    # Daftar IP: https://midtrans.com/id/blog/ip-address-midtrans
    location /api/webhooks/ {
        # allow 103.28.12.0/24;   # Midtrans IP range
        # deny all;
        limit_req zone=api burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Next.js static assets — cache agresif
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/proxy_params.conf;

        # Cache 1 tahun (static assets punya content hash)
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/proxy_params.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Semua route lainnya → Next.js
    location / {
        limit_req zone=static burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ─── Security ─────────────────────────────────────────────────────────────
    # Block common attack paths
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|swp|bak)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    # Limit upload size (untuk foto produk)
    client_max_body_size 10M;

    # Hide Nginx version
    server_tokens off;
}
