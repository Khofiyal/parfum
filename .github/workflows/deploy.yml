# .github/workflows/deploy.yml
# GitHub Actions — Zero-downtime deploy ke VPS via SSH

name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: "20"

jobs:
  # ─── Job 1: Lint & Type Check ─────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  # ─── Job 2: Deploy ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p ${VPS_PORT} ${VPS_USER}@${VPS_HOST} << 'ENDSSH'
            set -e  # Exit on error

            echo "📦 Pulling latest code..."
            cd $DEPLOY_PATH
            git pull origin main

            echo "📥 Installing dependencies..."
            npm ci --prefer-offline --production=false

            echo "🗄️  Generating Prisma client..."
            npm run db:generate

            echo "🗄️  Running database migrations..."
            npm run db:migrate

            echo "🏗️  Building Next.js..."
            npm run build

            echo "♻️  Reloading PM2 (zero-downtime)..."
            pm2 reload ecosystem.config.js --update-env

            echo "✅ Deploy selesai!"
            pm2 status
          ENDSSH

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Deploy berhasil ke production"
          # Tambahkan notifikasi Slack/Discord/Telegram di sini jika perlu

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deploy GAGAL! Cek logs."
          # Rollback otomatis jika diperlukan:
          # ssh -p ${VPS_PORT} ${VPS_USER}@${VPS_HOST} "cd $DEPLOY_PATH && git checkout HEAD~1 && npm run build && pm2 reload ecosystem.config.js"
